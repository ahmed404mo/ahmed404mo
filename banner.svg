<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="Ahmed Mokhtar — Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#0e1a30"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28A9E0"/>
      <stop offset="100%" stop-color="#00BFFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#28A9E0" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#28A9E0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#28A9E0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <clipPath id="avatarClip">
      <circle cx="1340" cy="200" r="116"/>
    </clipPath>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>
  <rect x="0" y="0" width="8" height="400" fill="url(#line)"/>

  <text x="110" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#28A9E0" letter-spacing="6">FULL-STACK DEVELOPER</text>

  <text x="108" y="205" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="1">Ahmed Mokhtar</text>

  <rect x="112" y="232" width="140" height="6" rx="3" fill="url(#line)"/>

  <text x="112" y="290" font-family="'Fira Code', 'Consolas', 'Courier New', monospace" font-size="32" fill="#8fb3d9">const role = &lt;Full-Stack Developer /&gt;;</text>

  <g font-family="'Fira Code', 'Consolas', 'Courier New', monospace" font-size="20">
    <rect x="112" y="316" width="118" height="38" rx="19" fill="#ffffff" opacity="0.06"/>
    <text x="126" y="340" fill="#a3e2a3">MERN</text>
    <rect x="246" y="316" width="130" height="38" rx="19" fill="#ffffff" opacity="0.06"/>
    <text x="260" y="340" fill="#c792ea">NestJS</text>
    <rect x="392" y="316" width="140" height="38" rx="19" fill="#ffffff" opacity="0.06"/>
    <text x="406" y="340" fill="#ffd479">GraphQL</text>
    <rect x="548" y="316" width="172" height="38" rx="19" fill="#ffffff" opacity="0.06"/>
    <text x="562" y="340" fill="#28A9E0">TypeScript</text>
  </g>

  <circle cx="1340" cy="200" r="210" fill="url(#halo)"/>
  <circle cx="1340" cy="200" r="132" fill="none" stroke="url(#line)" stroke-width="3" opacity="0.6"/>
  <circle cx="1340" cy="200" r="122" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  <image href="images/profile.jpeg" x="1224" y="84" width="232" height="232" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>
  <circle cx="1416" cy="282" r="16" fill="#3fb950" stroke="#0a0f1c" stroke-width="6"/>
</svg>
