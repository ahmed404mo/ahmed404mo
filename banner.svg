<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="Ahmed Mokhtar — Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#0e1a30"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28A9E0"/>
      <stop offset="100%" stop-color="#00BFFF"/>
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#dots)"/>
  <rect x="0" y="0" width="8" height="400" fill="url(#line)"/>

  <text x="110" y="180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="1">Ahmed Mokhtar</text>

  <text x="112" y="248" font-family="'Fira Code', 'Consolas', 'Courier New', monospace" font-size="36" fill="#8fb3d9">const role = &lt;Full-Stack Developer /&gt;;</text>

  <rect x="114" y="276" width="140" height="6" rx="3" fill="url(#line)"/>

  <rect x="980" y="100" width="520" height="220" rx="16" fill="#0d1526" stroke="#1e3a5f" stroke-width="2"/>
  <g font-family="'Fira Code', 'Consolas', 'Courier New', monospace" font-size="20">
    <text x="1010" y="145" fill="#c792ea">
      <tspan fill="#c792ea">const</tspan>
      <tspan fill="#ffffff"> developer </tspan>
      <tspan fill="#8fb3d9">= {</tspan>
    </text>
    <text x="1010" y="180" fill="#8fb3d9">
      <tspan>  name:</tspan>
      <tspan fill="#a3e2a3"> "Ahmed Mokhtar",</tspan>
    </text>
    <text x="1010" y="215" fill="#8fb3d9">
      <tspan>  stack:</tspan>
      <tspan fill="#ffd479"> ["MERN", "NestJS", "GraphQL"],</tspan>
    </text>
    <text x="1010" y="250" fill="#8fb3d9">
      <tspan>  focus:</tspan>
      <tspan fill="#ff9e6b"> "clean, scalable web apps",</tspan>
    </text>
    <text x="1010" y="285" fill="#8fb3d9">};</text>
  </g>
</svg>
